name: Plugin core verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: make test
      - run: make validate
      - name: Validate and render the first-deployment example
        run: |
          make validate CATALOG=examples/hello/catalog STACK=examples/hello/stack.yaml \
            PROFILE=examples/hello/profile.yaml LOCK=examples/hello/versions.lock.yaml
          make render CATALOG=examples/hello/catalog STACK=examples/hello/stack.yaml \
            PROFILE=examples/hello/profile.yaml LOCK=examples/hello/versions.lock.yaml \
            > /tmp/hello-applicationset.yaml
      - run: make render > /tmp/applicationsets.yaml
      - run: make fresh-clone-test

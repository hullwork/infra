name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Verify, attest, and release
    if: github.repository == 'hullwork/infra'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify annotated tag, version, and main ancestry
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be semantic version vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
            echo "release tag ${tag} must be an annotated tag" >&2
            exit 1
          fi
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "tag ${tag} does not match VERSION ${version}" >&2
            exit 1
          fi
          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for ${version}" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${tag}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
            echo "checkout HEAD does not match the tagged commit" >&2
            exit 1
          fi
          comparison="$(
            gh api "/repos/${GITHUB_REPOSITORY}/compare/${tag_commit}...main" --jq '.status'
          )"
          if [[ "${comparison}" != "ahead" && "${comparison}" != "identical" ]]; then
            echo "tagged commit ${tag_commit} is not contained in origin/main" >&2
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "commit=${tag_commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify the core
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
          python scripts/infra.py validate \
            --catalog catalog/packages \
            --stack examples/stacks/demo.yaml \
            --profile examples/profiles/local.yaml \
            --lock versions.lock.yaml

      - name: Build deterministic release archives
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          core_paths=(
            VERSION CHANGELOG.md LICENSE README.md Makefile requirements-dev.txt
            SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md SUPPORT.md
            bootstrap catalog contracts docs examples lima
            scripts tests versions.lock.yaml
          )
          contract_paths=(
            VERSION LICENSE docs/PACKAGE_AUTHORING.md contracts/v1alpha1
          )

          git archive --format=tar \
            --prefix="infra-core-${RELEASE_VERSION}/" \
            "${RELEASE_COMMIT}" -- "${core_paths[@]}" \
            | gzip -n > "release/infra-core-${RELEASE_VERSION}.tar.gz"
          git archive --format=tar \
            --prefix="infra-contracts-${RELEASE_VERSION}/" \
            "${RELEASE_COMMIT}" -- "${contract_paths[@]}" \
            | gzip -n > "release/infra-contracts-${RELEASE_VERSION}.tar.gz"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "schemaVersion": 1,
              "name": "infra",
              "version": os.environ["RELEASE_VERSION"],
              "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["RELEASE_COMMIT"],
              "repository": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"],
          }
          Path("release/RELEASE-METADATA.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n"
          )
          PY

          sbom_root="${RUNNER_TEMP}/infra-core-${RELEASE_VERSION}"
          mkdir -p "${sbom_root}"
          tar -xzf "release/infra-core-${RELEASE_VERSION}.tar.gz" \
            -C "${sbom_root}" --strip-components=1

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: ${{ runner.temp }}/infra-core-${{ steps.release.outputs.version }}
          format: spdx-json
          output-file: release/infra-${{ steps.release.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum RELEASE-METADATA.json infra-*.tar.gz infra-*.spdx.json > SHA256SUMS

      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release/*

      - name: Preserve release assets as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infra-${{ steps.release.outputs.version }}-release-assets
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" release/* \
            --verify-tag \
            --title "infra ${RELEASE_TAG}" \
            --generate-notes \
            "${prerelease[@]}"

apiVersion: v1
kind: Namespace
metadata:
  name: gitops-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-server-data
  namespace: gitops-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: gitops-system
  labels:
    app.kubernetes.io/name: git-server
    app.kubernetes.io/part-of: infra-gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server
        app.kubernetes.io/part-of: infra-gitops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-repository
          image: infra-git-server:2.54.0-r0
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              if [ ! -d /git/gitops.git/objects ]; then
                git init --bare --initial-branch=main /git/gitops.git
              fi
              git config --file /git/gitops.git/config daemon.receivepack true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /git
      containers:
        - name: git
          image: infra-git-server:2.54.0-r0
          imagePullPolicy: Never
          args:
            - daemon
            - --reuseaddr
            - --base-path=/git
            - --export-all
            - --enable=receive-pack
            - --verbose
            - /git
          ports:
            - name: git
              containerPort: 9418
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
          readinessProbe:
            exec:
              command:
                - git
                - ls-remote
                - git://127.0.0.1:9418/gitops.git
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - git
                - ls-remote
                - git://127.0.0.1:9418/gitops.git
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /git
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: git-server-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: gitops-system
  labels:
    app.kubernetes.io/name: git-server
    app.kubernetes.io/part-of: infra-gitops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: git-server
  ports:
    - name: git
      port: 9418
      targetPort: git
      nodePort: 30418
      protocol: TCP

apiVersion: infra.convee.io/v1alpha1
kind: ClusterProfile
metadata:
  name: local
spec:
  project: default
  argocdNamespace: argocd
  applicationSetPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  clusters:
    - name: in-cluster
      server: https://kubernetes.default.svc
      labels:
        environment: local
      capabilities:
        provides: []
  syncPolicy:
    automated: true
    # Resource pruning within an Application is a separate opt-in.
    prune: false
    selfHeal: true
